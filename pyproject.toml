[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outmind"
version = "0.1.0"
description = "Minimalist, hackable open-source framework for building and training custom SLMs from scratch."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Mesosfer-AI" }
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "tiktoken>=0.7.0",
    "tokenizers>=0.19.0",
    "regex>=2024.4.16",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
gpu = [
    "flash-attn>=2.5.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["outmind*"]
